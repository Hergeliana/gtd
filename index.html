<style>

[data-theme="dark"]{

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
input,select,button,textarea{font-family:inherit;}
button{transition:background var(--t),color var(--t),transform var(--t),box-shadow var(--t),border-color var(--t);}
button:active{transform:translateY(1px);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(20,30,55,0.18);border-radius:6px;}
::-webkit-scrollbar-thumb:hover{background:rgba(20,30,55,0.3);}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;}
.task-card{transition:box-shadow var(--t),transform var(--t);}
.task-card:hover{box-shadow:var(--shadow-md);}
.btn-3d{box-shadow:0 1px 2px rgba(20,30,55,0.10), inset 0 -1px 0 rgba(20,30,55,0.07), inset 0 1px 0 rgba(255,255,255,0.35);}
.btn-3d:hover{box-shadow:0 2px 5px rgba(20,30,55,0.14), inset 0 -1px 0 rgba(20,30,55,0.07), inset 0 1px 0 rgba(255,255,255,0.35);transform:translateY(-1px);}
.btn-3d:active{box-shadow:0 1px 2px rgba(20,30,55,0.10), inset 0 1px 0 rgba(20,30,55,0.10);transform:translateY(0);}
.nav-item{transition:background var(--t),color var(--t),border-color var(--t);}
.nav-item:hover{background:rgba(255,255,255,0.04);}
.capture-input{border:1px solid var(--border)!important;background:var(--field-bg)!important;color:var(--ink)!important;border-radius:10px!important;box-shadow:var(--shadow-sm);transition:border-color var(--t),box-shadow var(--t);}
.capture-input:focus{border-color:#bcd0ec!important;box-shadow:0 0 0 4px rgba(59,130,246,0.10),var(--shadow-sm);}
.mobile-topbar{display:none;}
.drawer-overlay{display:none;}
@media(max-width:640px) and (orientation:portrait){

  .main{padding:16px!important;padding-bottom:32px!important;max-width:100%!important;width:100%!important;}
  .modal-box{width:100%!important;max-width:100%!important;max-height:92vh!important;border-radius:16px 16px 0 0!important;position:fixed!important;bottom:0!important;left:0!important;right:0!important;margin:0!important;}
  .modal-overlay{align-items:flex-end!important;}
  .capture-bar{position:fixed!important;left:0!important;right:0!important;bottom:calc(54px + env(safe-area-inset-bottom,0px))!important;margin:0!important;padding:10px 12px!important;background:var(--surface)!important;border-top:1px solid var(--border)!important;box-shadow:0 -4px 16px rgba(20,30,55,0.06)!important;z-index:50!important;gap:8!important;}
  .bottom-tabs{display:flex!important;position:fixed!important;left:0!important;right:0!important;bottom:0!important;background:var(--surface)!important;border-top:none!important;box-shadow:none!important;z-index:49!important;height:calc(54px + env(safe-area-inset-bottom,0px))!important;padding-bottom:env(safe-area-inset-bottom,0px)!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .bottom-tabs::-webkit-scrollbar{display:none;}
  .bottom-tabs>button{flex:0 0 auto;min-width:68px;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-family:inherit;font-size:10px;color:var(--muted-2);padding:0 8px;border-top:2px solid transparent;}
  .bottom-tabs>button.active{color:var(--ink);font-weight:600;}

const TASK_SECTIONS=["twomin","defer","delegate","someday","reference"];

  trash:   {bg:"#d13030", light:"#fce8e8", text:"#6b0000"},

const sectionColor={twomin:IC.twomin.bg,defer:IC.defer.bg,delegate:IC.delegate.bg,someday:IC.someday.bg,reference:IC.reference.bg,trash:IC.trash.bg};
const navIconColor={inbox:IC.inbox.bg,twomin:IC.twomin.bg,defer:IC.defer.bg,delegate:IC.delegate.bg,projects:IC.projects.bg,someday:IC.someday.bg,reference:IC.reference.bg,trash:IC.trash.bg,calendar:IC.calendar.bg,review:IC.review.bg};

/* ── SVG Icons — filled & coloured ── */

    </svg>

    </svg>
  ),
  projects:({size=16,color="currentColor"})=>(
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke="none">
      <path d="M2 6a2 2 0 012-2h4.586A2 2 0 0110 4.586L11.414 6H20a2 2 0 012 2v11a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
    </svg>
  ),
  someday:({size=16,color="currentColor"})=>(
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} stroke="none">
      <path fillRule="evenodd" clipRule="evenodd" d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zm-1 5a1 1 0 112 0v4a1 1 0 11-2 0v-4z"/>

  review:({size=16,color="currentColor"})=>(

      <path d="M2 6a2 2 0 012-2h4.586A2 2 0 0110 4.586L11.414 6H20a2 2 0 012 2v11a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>

const sectionIcons={inbox:Icons.inbox,twomin:Icons.twomin,defer:Icons.defer,delegate:Icons.delegate,projects:Icons.projects,someday:Icons.someday,reference:Icons.reference,archive:Icons.archive,trash:Icons.trash,calendar:Icons.calendar,review:Icons.review};

function getDaysInMonth(y,m){return new Date(y,m+1,0).getDate();}
function toDateStr(y,m,d){return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;}
const emptyEdit=()=>({text:"",section:"defer",context:"@anywhere",project:"",due:"",time:"",done:false,checklist:[]});
const fieldStyle={width:"100%",padding:"8px 10px",borderRadius:6,border:"1px solid var(--border-strong)",background:"var(--field-bg)",fontSize:13,fontFamily:"sans-serif",outline:"none",boxSizing:"border-box",color:"var(--field-ink)"};
const labelStyle={fontSize:11,fontFamily:"sans-serif",color:"var(--muted)",marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:0.5};
const mkBtn=(bg,color,extra)=>({padding:"8px 16px",background:bg,color:color||"#ffffff",border:"none",borderRadius:7,cursor:"pointer",fontSize:13,fontFamily:"sans-serif",...(extra||{})});

function fmt12(t){
  if(!t)return null;
  const[h,m]=t.split(":").map(Number);
  const ap=h>=12?"PM":"AM",hh=h%12||12;
  return `${hh}:${String(m).padStart(2,"0")} ${ap}`;
}

function duration(item){return(item.twoMin||item.section==="twomin")?2:30;}
function overlaps(a,b){
  if(!a.time||!b.time)return false;
  const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
  const aS=toMin(a.time),aE=aS+duration(a),bS=toMin(b.time),bE=bS+duration(b);
  return aS<bE&&bS<aE;
}
function getConflicts(items){
  const conflicts=new Set();
  const timed=items.filter(i=>i.time&&!i.done);
  for(let i=0;i<timed.length;i++)
    for(let j=i+1;j<timed.length;j++)
      if(overlaps(timed[i],timed[j])){conflicts.add(timed[i].id);conflicts.add(timed[j].id);}
  return conflicts;
}

function TimePicker({value,onChange}){
  return(
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <input type="time" value={value||""} onChange={e=>onChange(e.target.value)} style={{...fieldStyle,flex:1}}/>
      {value&&<button type="button" onClick={()=>onChange("")} style={{width:30,height:30,background:"#f0f1f3",border:"1px solid #cdd0d6",borderRadius:6,cursor:"pointer",fontSize:14,color:"#6b7280",flexShrink:0}}>×</button>}
    </div>
  );
}

function ProjectDropdown({value,onChange,projects}){
  const[open,setOpen]=useState(false);
  const[query,setQuery]=useState(value||"");
  const ref=useRef(null);
  useEffect(()=>{setQuery(value||"");},[value]);
  useEffect(()=>{
    const handler=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",handler);return()=>document.removeEventListener("mousedown",handler);
  },[]);
  const filtered=projects.filter(p=>p.name.toLowerCase().includes(query.toLowerCase()));
  return(
    <div ref={ref} style={{position:"relative"}}>
      <div style={{position:"relative"}}>
        <input value={query} onChange={e=>{setQuery(e.target.value);onChange(e.target.value);setOpen(true);}}
          onFocus={()=>setOpen(true)} placeholder="Assign project..." style={{...fieldStyle,paddingRight:28}}/>
        {value&&<button type="button" onClick={()=>{onChange("");setQuery("");setOpen(false);}}
          style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:14,color:"#6b7280",padding:0}}>×</button>}
      </div>
      {open&&(projects.length>0)&&(
        <div style={{position:"absolute",zIndex:400,top:"calc(100% + 4px)",left:0,right:0,background:"#ffffff",border:"1px solid #cdd0d6",borderRadius:8,boxShadow:"0 6px 20px rgba(0,0,0,0.12)",overflow:"hidden",maxHeight:180,overflowY:"auto"}}>
          {filtered.length===0&&<div style={{padding:"10px 12px",fontSize:13,color:"#9aa0ae",fontFamily:"sans-serif"}}>No projects found</div>}
          {filtered.map(p=>(
            <div key={p.id} onClick={()=>{onChange(p.name);setQuery(p.name);setOpen(false);}}
              style={{padding:"9px 12px",fontSize:13,fontFamily:"sans-serif",cursor:"pointer",background:value===p.name?"#f0f4f8":"transparent",color:"var(--ink)",display:"flex",alignItems:"center",gap:7,borderBottom:"1px solid #f0f1f3"}}
              onMouseEnter={e=>e.currentTarget.style.background="#f4f5f7"}
              onMouseLeave={e=>e.currentTarget.style.background=value===p.name?"#f0f4f8":"transparent"}>
              <Icons.folder size={12} color={IC.projects.bg}/>{p.name}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ChecklistEditor({checklist,onChange}){
  const[newItem,setNewItem]=useState("");
  const addItem=()=>{
    if(!newItem.trim())return;
    const id=Date.now();
    onChange([...checklist,{id,text:newItem.trim(),done:false}]);
    setNewItem("");
  };
  const toggleItem=id=>onChange(checklist.map(c=>c.id===id?{...c,done:!c.done}:c));
  const deleteItem=id=>onChange(checklist.filter(c=>c.id!==id));
  const updateText=(id,text)=>onChange(checklist.map(c=>c.id===id?{...c,text}:c));
  return(
    <div style={{marginBottom:12}}>
      <label style={labelStyle}>Checklist</label>
      {checklist.map(c=>(
        <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
          <input type="checkbox" checked={c.done} onChange={()=>toggleItem(c.id)} style={{width:21,height:21,cursor:"pointer",accentColor:IC.projects.bg,flexShrink:0}}/>
          <input value={c.text} onChange={e=>updateText(c.id,e.target.value)}
            style={{...fieldStyle,padding:"8px 12px",fontSize:18,textDecoration:c.done?"line-through":"none",color:c.done?"#9aa0ae":"#1e2430",flex:1}}/>
          <button type="button" onClick={()=>deleteItem(c.id)}
            style={{background:"none",border:"none",cursor:"pointer",color:"#9aa0ae",fontSize:16,padding:"0 2px",lineHeight:1,flexShrink:0}}>×</button>
        </div>
      ))}
      <div style={{display:"flex",gap:10,marginTop:6}}>
        <input value={newItem} onChange={e=>setNewItem(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addItem()}
          placeholder="Add checklist item..." style={{...fieldStyle,padding:"8px 12px",fontSize:18,flex:1}}/>
        <button type="button" onClick={addItem}
          style={{padding:"8px 16px",background:IC.projects.bg,color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:16,fontFamily:"sans-serif",flexShrink:0}}>+ Add</button>
      </div>
    </div>
  );
}

function EditFields({form,setForm,showSection,projects,showChecklist}){
  return(
    <React.Fragment>
      <div style={{marginBottom:12}}>
        <label style={labelStyle}>Task name</label>
        <textarea value={form.text} rows={1}
          ref={el=>{if(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}}}
          onChange={e=>{setForm(f=>({...f,text:e.target.value}));e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
          style={{...fieldStyle,fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",fontSize:14,padding:"10px 12px",resize:"none",overflow:"hidden",lineHeight:1.4,boxSizing:"border-box"}}/>
      </div>
      {showSection&&(
        <div style={{marginBottom:12}}>
          <label style={labelStyle}>Folder</label>
          <div style={{display:"flex",flexWrap:"wrap",gap:7}}>
            {TASK_SECTIONS.map(s=>{
              const Icon=sectionIcons[s];
              const pal=IC[s]||{bg:"#8a7a65",light:"#f0ebe0",text:"#2c2416"};
              const sel=form.section===s;
              return(
                <button key={s} onClick={()=>setForm(f=>({...f,section:s}))}
                  style={{padding:"7px 13px",border:sel?`2px solid ${pal.bg}`:`1px dashed ${pal.bg}66`,borderRadius:8,background:sel?pal.bg:pal.light+"80",color:sel?"#fff":pal.text,cursor:"pointer",fontSize:12,fontFamily:"sans-serif",display:"flex",alignItems:"center",gap:6,fontWeight:sel?"bold":"normal",boxShadow:sel?`0 3px 10px ${pal.bg}66`:"none",transition:"all 0.15s"}}>
                  {Icon&&<Icon size={13} color={sel?"#fff":pal.bg}/>}
                  {sectionLabels[s]}
                </button>
              );
            })}
          </div>
        </div>
      )}
      <div style={{display:"flex",gap:12,marginBottom:12}}>
        <div style={{flex:1}}>
          <label style={labelStyle}>Context</label>
          <select value={form.context} onChange={e=>setForm(f=>({...f,context:e.target.value}))} style={fieldStyle}>
            {CONTEXTS.map(c=><option key={c}>{c}</option>)}
          </select>
        </div>
        <div style={{flex:1}}>
          <label style={labelStyle}>Project</label>
          <select value={form.project||""} onChange={e=>setForm(f=>({...f,project:e.target.value}))} style={fieldStyle}>
            <option value="">— None —</option>
            {projects.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
          </select>
        </div>
      </div>
      <div style={{display:"flex",gap:12,marginBottom:12}}>
        <div style={{flex:1}}>
          <label style={labelStyle}>Due date (optional)</label>
          <input type="date" value={form.due||""} onChange={e=>setForm(f=>({...f,due:e.target.value}))} style={fieldStyle}/>
        </div>
        <div style={{flex:1}}>
          <label style={labelStyle}>Time (optional)</label>
          <TimePicker value={form.time||""} onChange={t=>setForm(f=>({...f,time:t}))}/>
        </div>
      </div>
      {showChecklist&&(
        <ChecklistEditor checklist={form.checklist||[]} onChange={cl=>setForm(f=>({...f,checklist:cl}))}/>
      )}
    </React.Fragment>
  );
}

function App(){
  const[view,setView]=useState("inbox");
  const[data,setData]=useState({items:[],projects:[],nextId:1});
  const[input,setInput]=useState("");
  const[clarifyItem,setClarifyItem]=useState(null);
  const[clarify,setClarify]=useState({});
  const[editItem,setEditItem]=useState(null);
  const[editForm,setEditForm]=useState(emptyEdit());
  const[newProject,setNewProject]=useState("");
  const[expandedProject,setExpandedProject]=useState(null);
  const[addTaskModal,setAddTaskModal]=useState(null);
  const[taskForm,setTaskForm]=useState({text:"",section:"defer",context:"@anywhere",project:"",due:"",time:"",checklist:[]});
  const[captureModal,setCaptureModal]=useState(null);
  const[captureForm,setCaptureForm]=useState({text:"",section:"defer",context:"@anywhere",project:"",due:"",time:"",checklist:[]});
  const[archiveExpanded,setArchiveExpanded]=useState({});
  const[expandedTaskId,setExpandedTaskId]=useState(null);
  const[darkMode,setDarkMode]=useState(()=>{try{return localStorage.getItem("gtd-theme")==="dark";}catch{return false;}});
  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",darkMode?"dark":"light");
    try{localStorage.setItem("gtd-theme",darkMode?"dark":"light");}catch{}
  },[darkMode]);
  const[openChecklists,setOpenChecklists]=useState({});
  const toggleChecklistOpen=id=>setOpenChecklists(o=>({...o,[id]:!o[id]}));
  const addChecklistLine=itemId=>{
    const newId=Date.now()+Math.random();
    setData(d=>({...d,items:d.items.map(i=>i.id===itemId?{...i,checklist:[...(i.checklist||[]),{id:newId,text:"",done:false}]}:i)}));
    setOpenChecklists(o=>({...o,[itemId]:true}));
    setTimeout(()=>{const el=document.querySelector(`[data-cl-id="${newId}"]`);if(el)el.focus();},0);
  };
  const updateChecklistText=(itemId,clId,text)=>setData(d=>({...d,items:d.items.map(i=>i.id===itemId?{...i,checklist:(i.checklist||[]).map(c=>c.id===clId?{...c,text}:c)}:i)}));
  const deleteChecklistLine=(itemId,clId)=>setData(d=>({...d,items:d.items.map(i=>i.id===itemId?{...i,checklist:(i.checklist||[]).filter(c=>c.id!==clId)}:i)}));
  const inputRef=useRef(null);
  useEffect(()=>{if(inputRef.current){inputRef.current.style.height="auto";inputRef.current.style.height=inputRef.current.scrollHeight+"px";}},[input]);
  const[toast,setToast]=useState(null);
  const today=new Date();
  const[calYear,setCalYear]=useState(today.getFullYear());
  const[calMonth,setCalMonth]=useState(today.getMonth());
  const[calDay,setCalDay]=useState(null);
  const[calMode,setCalMode]=useState("month");
  const[weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());return d;});
  const[drawerOpen,setDrawerOpen]=useState(false);
  const[cloudReady,setCloudReady]=useState(false);
  const[cloudUserId,setCloudUserId]=useState(null);
  const saveTimerRef=useRef(null);
  const skipNextSaveRef=useRef(false);
  const DEFAULT_DATA={items:[],projects:[],nextId:1};

  useEffect(()=>{
    let alive=true;
    (async()=>{
      try{
        const { data: sessionData, error: sessionError } = await sb.auth.getSession();
        if(sessionError) throw sessionError;
        const user=sessionData?.session?.user;
        if(!user){
          if(alive) setCloudReady(true);
          return;
        }
        if(alive) setCloudUserId(user.id);

        const { data: row, error } = await sb
          .from("gtd_state")
          .select("state")
          .eq("user_id", user.id)
          .maybeSingle();

        if(error) throw error;

        if(row?.state && typeof row.state==="object" && Array.isArray(row.state.items) && Array.isArray(row.state.projects) && typeof row.state.nextId==="number"){
          skipNextSaveRef.current=true;
          if(alive) setData(row.state);
        }else{
          const starterData={items:[],projects:[],nextId:1};
          skipNextSaveRef.current=true;
          if(alive) setData(starterData);
          const { error: insertError } = await sb
            .from("gtd_state")
            .upsert({
              user_id:user.id,
              content:"",
              state:starterData
            }, { onConflict:"user_id" });
          if(insertError) throw insertError;
        }
      }catch(err){
        console.error("Cloud load failed:", err);
      }finally{
        if(alive) setCloudReady(true);
      }
    })();
    return()=>{alive=false; if(saveTimerRef.current) clearTimeout(saveTimerRef.current);};
  },[]);

  useEffect(()=>{
    if(!cloudReady || !cloudUserId) return;
    if(skipNextSaveRef.current){ skipNextSaveRef.current=false; return; }
    if(saveTimerRef.current) clearTimeout(saveTimerRef.current);
    saveTimerRef.current=setTimeout(async()=>{
      try{
        const { error } = await sb
          .from("gtd_state")
          .upsert({
            user_id:cloudUserId,
            content:"",
            state:data
          }, { onConflict:"user_id" });
        if(error) throw error;
      }catch(err){
        console.error("Cloud save failed:", err);
      }
    },250);
    return()=>{ if(saveTimerRef.current) clearTimeout(saveTimerRef.current); };
  },[data,cloudReady,cloudUserId]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2500);};

  const exportData=()=>{
    try{
      const json=JSON.stringify(data,null,2);
      const uri="data:application/json;charset=utf-8,"+encodeURIComponent(json);
      const a=document.createElement("a");
      a.href=uri;a.download="gtd-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      showToast("Backup exported!");
    }catch(e){showToast("Export failed.");}
  };

  const importData=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        if(parsed.items&&parsed.projects&&parsed.nextId){setData(parsed);showToast("Backup imported!");}
        else showToast("Invalid backup file.");
      }catch{showToast("Failed to read file.");}
    };
    reader.readAsText(file);e.target.value="";
  };

  const addToInbox=()=>{
    if(!input.trim())return;
    if(TASK_SECTIONS.includes(view)){
      setCaptureForm({text:input.trim(),section:view,context:"@anywhere",project:"",due:"",time:"",checklist:[]});
      setCaptureModal(view);
      setInput("");
      return;
    }
    const id=data.nextId;
    setData(d=>({...d,nextId:d.nextId+1,items:[...d.items,{id,text:input.trim(),section:"inbox",context:"@anywhere",project:null,due:null,time:null,twoMin:false,checklist:[],done:false,created:Date.now()}]}));
    setInput("");showToast("Captured to In Basket!");
  };
  const applyCapture=()=>{
    if(!captureForm.text.trim())return;
    const id=data.nextId;
    setData(d=>({...d,nextId:d.nextId+1,items:[...d.items,{id,text:captureForm.text.trim(),section:captureForm.section,context:captureForm.context,project:captureForm.project||null,due:captureForm.due||null,time:captureForm.time||null,twoMin:captureForm.section==="twomin",checklist:captureForm.checklist||[],done:false,created:Date.now()}]}));
    setCaptureModal(null);showToast("Captured to "+sectionLabels[captureForm.section]);
  };

  const openClarify=item=>{setClarifyItem(item);setClarify({actionable:null,twoMin:false,context:item.context||"@anywhere",project:item.project||"",due:item.due||"",time:item.time||"",destination:"defer",text:item.text,naSection:"reference"});};
  const applyClarify=()=>{
    const{actionable,twoMin,context,project,due,time,destination,text,naSection}=clarify;
    if(actionable===null){
      if(!text.trim()){setClarifyItem(null);return;}
      setData(d=>({...d,items:d.items.map(i=>i.id===clarifyItem.id?{...i,text:text.trim()}:i)}));
      setClarifyItem(null);showToast("Updated");
      return;
    }
    const section=actionable?(twoMin?"twomin":destination):naSection;
    setData(d=>({...d,items:d.items.map(i=>i.id===clarifyItem.id?{...i,text,section,context,project:project||null,due:due||null,time:time||null,twoMin,done:false}:i)}));
    setClarifyItem(null);showToast("Moved to "+sectionLabels[section]);
  };

  const openEdit=item=>{setEditItem(item);setEditForm({text:item.text,section:item.section,context:item.context||"@anywhere",project:item.project||"",due:item.due||"",time:item.time||"",done:item.done,checklist:item.checklist||[]});};
  const applyEdit=()=>{
    setData(d=>({...d,items:d.items.map(i=>i.id===editItem.id?{...i,...editForm,twoMin:editForm.section==="twomin",project:editForm.project||null,due:editForm.due||null,time:editForm.time||null,checklist:editForm.checklist||[]}:i)}));
    setEditItem(null);showToast("Item updated!");
  };

  const moveItem=(id,section)=>setData(d=>({...d,items:d.items.map(i=>i.id===id?{...i,section}:i)}));
  const trashItem=id=>setData(d=>({...d,items:d.items.map(i=>i.id===id?{...i,section:"trash",trashedFrom:i.section}:i)}));
  const restoreItem=id=>setData(d=>({...d,items:d.items.map(i=>i.id===id?{...i,section:i.trashedFrom||"inbox",trashedFrom:null}:i)}));
  const toggleDone=id=>setData(d=>({...d,items:d.items.map(i=>i.id===id?{...i,done:!i.done}:i)}));
  const deleteItem=id=>setData(d=>({...d,items:d.items.filter(i=>i.id!==id)}));

  const addProject=()=>{
    if(!newProject.trim())return;
    const id=data.nextId;
    setData(d=>({...d,projects:[...d.projects,{id,name:newProject.trim()}],nextId:d.nextId+1}));
    setNewProject("");setExpandedProject(id);
  };
  const deleteProject=pid=>{
    const pname=data.projects.find(p=>p.id===pid)?.name;
    setData(d=>({...d,projects:d.projects.filter(p=>p.id!==pid),items:d.items.map(i=>i.project===pname?{...i,project:null}:i)}));
  };
  const archiveProject=pid=>setData(d=>({...d,projects:d.projects.map(p=>p.id===pid?{...p,archived:true}:p)}));
  const restoreProject=pid=>setData(d=>({...d,projects:d.projects.map(p=>p.id===pid?{...p,archived:false}:p)}));
  const openAddTask=pid=>{
    const proj=data.projects.find(p=>p.id===pid);
    setAddTaskModal(pid);setTaskForm({text:"",section:"defer",context:"@anywhere",project:proj?.name||"",due:"",time:"",checklist:[]});
  };
  const applyAddTask=()=>{
    if(!taskForm.text.trim())return;
    const proj=data.projects.find(p=>p.id===addTaskModal);if(!proj)return;
    const id=data.nextId;
    setData(d=>({...d,nextId:d.nextId+1,items:[...d.items,{id,text:taskForm.text.trim(),section:taskForm.section,context:taskForm.context,project:proj.name,due:taskForm.due||null,time:taskForm.time||null,twoMin:taskForm.section==="twomin",checklist:[],done:false,created:Date.now()}]}));
    setAddTaskModal(null);showToast("Task added to "+proj.name);
  };

  const isOverdue=due=>due&&new Date(due)<new Date(new Date().toDateString());
  const isDueSoon=due=>{if(!due)return false;const d=new Date(due),today=new Date(new Date().toDateString());return d>=today&&d<new Date(today.getTime()+7*86400000);};
  const sortByTime=arr=>[...arr].sort((a,b)=>{if(!!a.done!==!!b.done)return a.done?1:-1;if(a.due&&b.due){const c=a.due.localeCompare(b.due);if(c)return c;}else if(a.due)return -1;else if(b.due)return 1;if(a.time&&b.time)return a.time.localeCompare(b.time);if(a.time)return -1;if(b.time)return 1;return 0;});
  const itemsForDay=ds=>sortByTime(data.items.filter(i=>i.due===ds&&i.section!=="trash"));

  const inboxItems=data.items.filter(i=>i.section==="inbox");
  const hideDoneInView=TASK_SECTIONS.includes(view);
  const viewItems=["projects","calendar"].includes(view)?[]:sortByTime(data.items.filter(i=>i.section===view&&!(hideDoneInView&&i.done)));
  const archivedItems=hideDoneInView?sortByTime(data.items.filter(i=>i.section===view&&i.done)):[];
  const totalDone=data.items.filter(i=>i.done&&!excludedSections.includes(i.section)).length;
  const totalActive=data.items.filter(i=>!i.done&&!excludedSections.includes(i.section)).length;
  const progress=totalActive+totalDone>0?Math.round((totalDone/(totalActive+totalDone))*100):0;
  const stats={
    inbox:inboxItems.length,
    twomin:data.items.filter(i=>i.section==="twomin"&&!i.done).length,
    defer:data.items.filter(i=>i.section==="defer"&&!i.done).length,
    delegate:data.items.filter(i=>i.section==="delegate"&&!i.done).length
  };

  const daysInMonth=getDaysInMonth(calYear,calMonth);
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const todayStr=toDateStr(today.getFullYear(),today.getMonth(),today.getDate());
  const selectedDayItems=calDay?itemsForDay(calDay):[];
  const selectedDayConflicts=calDay?getConflicts(selectedDayItems):new Set();
  const allConflictIds=new Set();
  const byDate={};
  data.items.filter(i=>i.due&&i.section!=="trash").forEach(i=>{if(!byDate[i.due])byDate[i.due]=[];byDate[i.due].push(i);});
  Object.values(byDate).forEach(di=>{getConflicts(di).forEach(id=>allConflictIds.add(id));});

  const toggleChecklistItem=(itemId,clId)=>setData(d=>({...d,items:d.items.map(i=>i.id===itemId?{...i,checklist:(i.checklist||[]).map(c=>c.id===clId?{...c,done:!c.done}:c)}:i)}));

  function MetaRow({item,conflict,hideProject}){
    const hasDate=item.due||item.time;
    return(
      <div style={{fontSize:12,color:"#6b7280",marginTop:3,fontFamily:"sans-serif",display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        {item.context&&item.context!=="@anywhere"&&<span>{item.context}</span>}
        {!hideProject&&item.project&&<span style={{display:"inline-flex",alignItems:"center",gap:3,color:IC.projects.bg}}><Icons.folder size={10} color={IC.projects.bg}/>{item.project}</span>}
        {hasDate&&(
          <span style={{display:"inline-flex",alignItems:"center",gap:3,color:item.done?"#6b7280":conflict?"#d04020":isOverdue(item.due)?"#d13030":isDueSoon(item.due)?"#b5860d":"#6b7280",fontWeight:!item.done&&conflict?"bold":"normal"}}>
            {conflict&&<span>⚠</span>}
            {item.due&&<span>{item.due}</span>}
            {item.time&&<span style={{background:conflict?"#fce8e8":"#dde0e6",borderRadius:4,padding:"1px 5px",color:conflict?"#d04020":"#3a4460"}}>{fmt12(item.time)}</span>}
          </span>
        )}
      </div>
    );
  }

  function InlineChecklist({item}){
    const cl=item.checklist||[];
    const doneCt=cl.filter(c=>c.done).length;
    const open=!!openChecklists[item.id];
    return(
      <div style={{marginTop:7,paddingTop:6,borderTop:"1px dashed #eceef2"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <button onClick={e=>{e.stopPropagation();toggleChecklistOpen(item.id);}}
            style={{background:"none",border:"none",cursor:"pointer",padding:"2px 4px",fontSize:13,fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",color:"#6b7280",display:"flex",alignItems:"center",gap:5}}>
            {cl.length>0?`Checklist (${doneCt}/${cl.length})`:"Checklist"}
            <span style={{fontSize:11}}>{open?"▾":"▸"}</span>
          </button>
          <button onClick={e=>{e.stopPropagation();addChecklistLine(item.id);}}
            title="Add checklist item"
            style={{background:"var(--btn-cl-bg)",color:"var(--btn-cl-ink)",border:"none",borderRadius:7,cursor:"pointer",padding:"3px 10px",fontSize:12,fontFamily:"sans-serif",fontWeight:"bold",lineHeight:1.3}}>ADD</button>
        </div>
        {open&&cl.length>0&&(
          <div style={{marginTop:6,paddingLeft:4}}>
            {cl.map(c=>(
              <div key={c.id} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                <div onClick={e=>{e.stopPropagation();toggleChecklistItem(item.id,c.id);}}
                  style={{width:16,height:16,borderRadius:4,border:`2px solid ${c.done?IC.projects.bg:"#cdd0d6"}`,background:c.done?IC.projects.bg:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}>
                  {c.done&&<svg width="10" height="10" viewBox="0 0 24 24" fill="#fff" stroke="none"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>}
                </div>
                <input defaultValue={c.text} key={c.id+"|"+c.text} data-cl-id={c.id}
                  onBlur={e=>{const v=e.target.value;if(!v.trim())deleteChecklistLine(item.id,c.id);else if(v!==c.text)updateChecklistText(item.id,c.id,v);}}
                  onKeyDown={e=>{if(e.key==="Enter"){e.preventDefault();e.target.blur();}}}
                  onClick={e=>e.stopPropagation()}
                  placeholder="…"
                  style={{flex:1,fontSize:13,fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",border:"1px solid #eceef2",borderRadius:4,padding:"3px 7px",background:"#fafbfd",color:c.done?"#9aa0ae":"#3a4460",textDecoration:c.done?"line-through":"none",outline:"none"}}/>
                <button onClick={e=>{e.stopPropagation();deleteChecklistLine(item.id,c.id);}}
                  style={{background:"none",border:"none",cursor:"pointer",color:"#9aa0ae",fontSize:15,padding:"0 4px",lineHeight:1,flexShrink:0}}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  function ItemCard({item,showCheck,conflict,hideProject}){
    const cl=item.checklist||[];
    const clDone=cl.filter(c=>c.done).length;
    const isExpanded=expandedTaskId===item.id;
    return(
      <div className="task-card" onClick={()=>setExpandedTaskId(isExpanded?null:item.id)}
        style={{background:item.done?"var(--surface-2)":conflict?"#fdf0f0":"var(--surface)",border:"1px solid "+(conflict?"#f0c8c8":"var(--border)"),borderLeft:"4px solid "+(item.done?"var(--muted-2)":conflict?"#d13030":isOverdue(item.due)?"#a82d2d":isDueSoon(item.due)?"#d97706":"#5a9a5a"),borderRadius:10,padding:"13px 16px",marginBottom:8,opacity:item.done?0.72:1,cursor:"pointer",boxShadow:"var(--shadow-sm)",color:"var(--ink)"}}>
        <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
          {showCheck&&<input type="checkbox" checked={item.done} onChange={()=>toggleDone(item.id)} onClick={e=>e.stopPropagation()} style={{width:17,height:17,cursor:"pointer",accentColor:"#1e2430",flexShrink:0,marginTop:3}}/>}
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:15,textDecoration:item.done?"line-through":"none",display:"flex",alignItems:"flex-start",gap:6,flexWrap:"wrap"}}>
              <span style={{wordBreak:"break-word",overflowWrap:"anywhere",lineHeight:"1.35",flex:"1 1 auto",minWidth:0}}>{item.text}</span>
              {cl.length>0&&<span style={{fontSize:10,fontFamily:"sans-serif",background:clDone===cl.length?IC.projects.light:"#f0f1f3",color:clDone===cl.length?IC.projects.text:"#6b7280",borderRadius:10,padding:"1px 7px",flexShrink:0,border:`1px solid ${clDone===cl.length?IC.projects.bg+"40":"#dde0e6"}`}}>✓ {clDone}/{cl.length}</span>}
            </div>
            <MetaRow item={item} conflict={conflict} hideProject={hideProject}/>
          </div>
        </div>
        {!item.done&&cl.length>0&&<div onClick={e=>e.stopPropagation()}><InlineChecklist item={item}/></div>}
        {isExpanded&&(
          <div onClick={e=>e.stopPropagation()} style={{display:"flex",gap:6,marginTop:10,paddingTop:10,borderTop:"1px dashed #cdd0d6"}}>

          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>

  <button

style={{
  background: "none",

  fontSize: 12,
  fontFamily: "sans-serif",
  cursor: "pointer"
}}

            <div style={{display:"inline-flex",gap:0,padding:3,borderRadius:9,background:"var(--surface-2)",border:"1px solid var(--border)"}}>

                    {md==="month"?"Month":"Week"}
                  </button>

          <div>
            {inboxItems.length===0&&<p style={{color:"#6b7280",fontStyle:"italic"}}>Capture something</p>}

              const isExpanded=expandedTaskId===item.id;
              return(
              <div key={item.id} className="task-card" onClick={()=>setExpandedTaskId(isExpanded?null:item.id)}

                {isExpanded&&(
                  <div onClick={e=>e.stopPropagation()} style={{display:"flex",gap:6,marginTop:10,paddingTop:10,borderTop:"1px dashed #cdd0d6"}}>
                    <button className="btn-3d" onClick={()=>openClarify(item)} style={{padding:"12px 10px",fontSize:12,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-edit-bg)",color:"var(--btn-edit-ink)",flex:1}}>Clarify</button>
                    <button className="btn-3d" onClick={()=>trashItem(item.id)} style={{padding:"12px 10px",fontSize:12,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-del-bg)",color:"var(--btn-del-ink)",flex:1}}>Delete</button>
                  </div>
                )}
              </div>
            );})}
          </div>

        {/* LIST VIEWS */}
        {["twomin","defer","delegate","someday","reference"].includes(view)&&(
          <div>
            {viewItems.length===0&&<p style={{color:"#6b7280",fontStyle:"italic"}}>Nothing here yet.</p>}
            {viewItems.map(item=><ItemCard key={item.id} item={item} showCheck={["twomin","defer","delegate","someday"].includes(view)} conflict={allConflictIds.has(item.id)}/>)}
            {archivedItems.length>0&&(
              <div style={{marginTop:28}}>
                <button onClick={()=>setArchiveExpanded(a=>({...a,[view]:!a[view]}))}

                </button>
                {archiveExpanded[view]&&(
                  <div style={{borderTop:`1px dashed ${IC.archive.bg}`,paddingTop:10,marginTop:4}}>
                    {archivedItems.map(item=><ItemCard key={item.id} item={item} showCheck={true} conflict={false}/>)}
                  </div>

        {/* TRASH (grouped by original section) */}

          <div>

              const groups={};
              viewItems.forEach(it=>{const k=it.trashedFrom&&sectionLabels[it.trashedFrom]?it.trashedFrom:"unknown";if(!groups[k])groups[k]=[];groups[k].push(it);});
              return order.filter(k=>groups[k]).map(k=>{
                const Icon=sectionIcons[k];
                const color=navIconColor[k]||"#6b7280";

                  <div key={k} style={{marginBottom:22}}>

                  </div>

              });
            })()}
          </div>

        {view==="projects"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:24}}>

              const isOpen=expandedProject===p.id;

              tasks.forEach(t=>{if(!grouped[t.section])grouped[t.section]=[];grouped[t.section].push(t);});

                <div key={p.id} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:10,marginBottom:14,overflow:"hidden",boxShadow:"var(--shadow-sm)"}}>

                      <Icons.folder size={17} color={isOpen?IC.projects.bg:"var(--muted-2)"}/>

                    {tasks.length>0&&<div style={{width:80,background:"var(--border-strong)",borderRadius:4,height:5,overflow:"hidden"}}><div style={{width:(tasks.length?(done/tasks.length)*100:0)+"%",background:"#4a7fa5",height:"100%"}}/></div>}
                    <span style={{fontSize:12,color:"var(--muted)"}}>{isOpen?"▲":"▼"}</span>

                    <div style={{borderTop:"1px solid var(--border)",padding:"14px 18px"}}>
                      {tasks.length===0&&<p style={{color:"var(--muted)",fontStyle:"italic",fontSize:13,marginBottom:12}}>No tasks yet.</p>}

                          <div key={sec} style={{marginBottom:14}}>

                              {SecIcon&&<SecIcon size={11} color={navIconColor[sec]||sectionColor[sec]||"#6b7280"}/>}
                              {sectionLabels[sec]}

                                      {cl.length>0&&<span style={{fontSize:10,fontFamily:"sans-serif",background:clDone===cl.length?IC.projects.light:"var(--surface-3)",color:clDone===cl.length?IC.projects.text:"var(--muted)",borderRadius:10,padding:"1px 6px",flexShrink:0,border:`1px solid ${clDone===cl.length?IC.projects.bg+"40":"var(--border)"}`}}>✓ {clDone}/{cl.length}</span>}
                                    </div>
                                    <MetaRow item={item} conflict={allConflictIds.has(item.id)} hideProject={true}/>
                                  </div>
                                </div>
                                {!item.done&&cl.length>0&&<div onClick={e=>e.stopPropagation()}><InlineChecklist item={item}/></div>}
                                {isProjExpanded&&(
                                  <div onClick={e=>e.stopPropagation()} style={{display:"flex",gap:6,marginTop:10,paddingTop:10,borderTop:"1px dashed var(--border)"}}>
                                    <button className="btn-3d" onClick={()=>openEdit(item)} style={{padding:"9px 10px",fontSize:12,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-edit-bg)",color:"var(--btn-edit-ink)",flex:1}}>Edit</button>
                                    <button className="btn-3d" onClick={()=>trashItem(item.id)} style={{padding:"9px 10px",fontSize:12,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-del-bg)",color:"var(--btn-del-ink)",flex:1}}>Delete</button>
                                    {!item.done&&cl.length===0&&<button className="btn-3d" onClick={()=>addChecklistLine(item.id)} style={{padding:"9px 10px",fontSize:12,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-cl-bg)",color:"var(--btn-cl-ink)",flex:1}}>Add Checklist</button>}
                                  </div>
                                )}
                              </div>
                            );})}

                        <button className="btn-3d" onClick={()=>deleteProject(p.id)} style={{padding:"12px 8px",fontSize:13,border:"none",borderRadius:7,cursor:"pointer",fontFamily:"sans-serif",background:"var(--btn-del-bg)",color:"var(--btn-del-ink)",textAlign:"center",flex:1,minWidth:0,whiteSpace:"nowrap"}}>Delete</button>
                      </div>

            {(()=>{const archivedProjects=data.projects.filter(p=>p.archived);if(archivedProjects.length===0)return null;const archKey="projects-archive";const open=archiveExpanded[archKey];return(

                )}

          </div>
        )}

        {/* CALENDAR MONTH */}
        {view==="calendar"&&calMode==="month"&&(
          <div style={{display:"flex",gap:28,flexWrap:"wrap"}}>
            <div style={{flex:"1 1 100%",maxWidth:"100%",border:"1px solid var(--border)",borderRadius:10,padding:"14px 12px",background:"var(--surface)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
                <button onClick={()=>{if(calMonth===0){setCalMonth(11);setCalYear(y=>y-1);}else setCalMonth(m=>m-1);}} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"6px 12px"})}>◀</button>
                <span style={{fontWeight:"bold",fontSize:16,fontFamily:"sans-serif",color:"var(--ink)"}}>{MONTHS[calMonth]+" "+calYear}</span>
                <button onClick={()=>{if(calMonth===11){setCalMonth(0);setCalYear(y=>y+1);}else setCalMonth(m=>m+1);}} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"6px 12px"})}>▶</button>

              <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
                {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
                {Array(daysInMonth).fill(null).map((_,i)=>{
                  const d=i+1,ds=toDateStr(calYear,calMonth,d);
                  const di=itemsForDay(ds);
                  const hasConflict=di.some(it=>allConflictIds.has(it.id));
                  const isToday=ds===todayStr,isSel=ds===calDay;
                  return(
                    <div key={d} onClick={()=>setCalDay(isSel?null:ds)}
                      style={{textAlign:"center",padding:"7px 2px",borderRadius:6,cursor:"pointer",fontSize:13,fontFamily:"sans-serif",position:"relative",background:isSel?"var(--primary-bg)":isToday?"rgba(74,127,165,0.15)":"transparent",color:isSel?"var(--primary-ink)":"var(--ink)",border:isToday?"2px solid #4a7fa5":"2px solid transparent",fontWeight:isToday?"bold":"normal"}}>
                      {d}
                      {hasConflict&&<div style={{width:5,height:5,background:IC.trash.bg,borderRadius:"50%",position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)"}}/>}
                      {!hasConflict&&di.length>0&&<div style={{width:4,height:4,background:"#4a7fa5",borderRadius:"50%",position:"absolute",bottom:3,left:"50%",transform:"translateX(-50%)"}}/>}
                    </div>
                  );
                })}
              </div>
              <div style={{marginTop:10,display:"flex",gap:12,fontSize:11,fontFamily:"sans-serif",color:"var(--muted)"}}>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:"#4a7fa5",borderRadius:"50%",display:"inline-block"}}/>Tasks</span>
                <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:8,height:8,background:IC.trash.bg,borderRadius:"50%",display:"inline-block"}}/>Conflict</span>

            </div>
            <div style={{flex:1,minWidth:220}}>

                  {selectedDayItems.map((item,idx)=>(
                    <div key={item.id} style={{background:selectedDayConflicts.has(item.id)?IC.trash.light:"var(--surface)",border:"1px solid "+(selectedDayConflicts.has(item.id)?IC.trash.bg:"var(--border)"),borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",gap:10,alignItems:"flex-start"}}>

        {/* CALENDAR WEEK */}
        {view==="calendar"&&calMode==="week"&&(()=>{
          const ws=new Date(weekStart);

          const prevWeek=()=>setWeekStart(w=>{const d=new Date(w);d.setDate(d.getDate()-7);return d;});
          const nextWeek=()=>setWeekStart(w=>{const d=new Date(w);d.setDate(d.getDate()+7);return d;});
          const goToday=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());setWeekStart(d);};
          const wLabel=weekDays[0].toLocaleDateString("en-US",{month:"short",day:"numeric"})+" – "+weekDays[6].toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
          return(

                <button onClick={prevWeek} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"6px 12px"})}>◀</button>
                <button onClick={goToday} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"6px 12px",fontSize:12})}>Today</button>
                <span style={{fontWeight:"bold",fontSize:15,fontFamily:"sans-serif",flex:1,textAlign:"center",color:"var(--ink)"}}>{wLabel}</span>

                  const isToday=ds===todayStr;

                    <div key={ds} onClick={()=>setCalDay(isSel?null:ds)}
                      style={{background:isSel?"var(--surface-3)":"var(--surface)",borderLeft:idx===0?"none":"1px solid var(--border)",minHeight:140,cursor:"pointer",transition:"background 0.15s",position:"relative",minWidth:0,overflow:"hidden"}}>
                      {isSel&&<div style={{position:"absolute",top:0,left:0,right:0,height:3,background:"var(--primary-bg)"}}/>}
                      <div style={{padding:"6px 4px",background:isSel?"var(--primary-bg)":hasConflict?IC.trash.light:isToday?"rgba(74,127,165,0.18)":"var(--surface-2)",borderBottom:"1px solid var(--border)",textAlign:"center"}}>
                        <div style={{fontSize:10,fontFamily:"sans-serif",color:isSel?"rgba(255,255,255,0.75)":hasConflict?IC.trash.text:"var(--muted)",textTransform:"uppercase",letterSpacing:0.4}}>{DAYS[dayObj.getDay()]+(hasConflict?" ⚠":"")}</div>
                        <div style={{fontSize:15,fontWeight:isToday||isSel?"bold":"normal",fontFamily:"sans-serif",color:isSel?"var(--primary-ink)":"var(--ink)"}}>{dayObj.getDate()}</div>
                      </div>
                      <div style={{padding:"4px 3px"}}>
                        {di.length===0&&<div style={{fontSize:11,color:"var(--muted-2)",fontStyle:"italic",textAlign:"center",marginTop:6,fontFamily:"sans-serif"}}>–</div>}
                        {di.map(item=>{
                          const isConflict=dayConflicts.has(item.id);
                          return(
                            <div key={item.id}
                              style={{background:isConflict?IC.trash.light:item.done?"var(--surface-3)":(sectionColor[item.section]||"#4a7fa5")+"22",
                                borderLeft:"3px solid "+(isConflict?IC.trash.bg:sectionColor[item.section]||"#4a7fa5"),
                                borderRadius:3,padding:"3px 4px",marginBottom:3,opacity:item.done?0.5:1,pointerEvents:"none"}}>
                              <div style={{fontSize:10,fontFamily:"sans-serif",lineHeight:1.25,textDecoration:item.done?"line-through":"none",overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",color:"var(--ink)",wordBreak:"break-all",overflowWrap:"anywhere"}}>
                                {(isConflict?"⚠ ":"")+item.text}

                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
              {calDay&&weekDays.some(d=>toDateStr(d.getFullYear(),d.getMonth(),d.getDate())===calDay)&&(
                <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid var(--border)"}}>
                  <div style={{fontWeight:"bold",fontSize:16,marginBottom:8,fontFamily:"sans-serif",color:"var(--ink)"}}>{new Date(calDay+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
                  {selectedDayConflicts.size>0&&<div style={{background:IC.trash.light,border:`1px solid ${IC.trash.bg}`,borderRadius:7,padding:"8px 12px",marginBottom:12,fontSize:12,fontFamily:"sans-serif",color:IC.trash.text}}>Time conflict: {selectedDayConflicts.size} tasks overlap.</div>}

                    <div key={item.id} style={{background:selectedDayConflicts.has(item.id)?IC.trash.light:"var(--surface)",border:"1px solid "+(selectedDayConflicts.has(item.id)?IC.trash.bg:"var(--border)"),borderRadius:8,padding:"10px 14px",marginBottom:8,display:"flex",gap:10,alignItems:"flex-start"}}>

        {/* REVIEW */}
        {view==="review"&&(
          <div>
            <p style={{color:"#3a4460",lineHeight:1.7,marginBottom:24}}>Your weekly review keeps the GTD system trustworthy.</p>
            {[
              {title:"1. Collect loose papers & materials",desc:"Gather any physical notes and add them to your In Basket.",icon:Icons.inbox,sec:"inbox"},
              {title:"2. Empty your In Basket",desc:"You have "+stats.inbox+" item(s). Clarify each one.",action:()=>setView("inbox"),label:"Go to In Basket",icon:Icons.inbox,sec:"inbox"},

              {title:"4. Review Deferred & Delegated",desc:"Check what has been deferred or delegated.",action:()=>setView("defer"),label:"Go to Defer",icon:Icons.defer,sec:"defer"},

              {title:"6. Review Someday/Maybe",desc:"Decide what to activate, delete, or keep.",action:()=>setView("someday"),label:"Go to Someday",icon:Icons.someday,sec:"someday"},
              {title:"7. Be creative & courageous",desc:"Any new ideas? Capture them in your In Basket.",icon:Icons.inbox,sec:"inbox"},

                    {StepIcon&&<StepIcon size={18} color={pal.bg}/>}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:"bold",fontSize:15,marginBottom:4,color:"var(--ink)"}}>{step.title}</div>
                    <div style={{fontSize:14,color:"#3a4460",lineHeight:1.6}}>{step.desc}</div>
                    {step.action&&<button onClick={step.action} style={{...mkBtn(pal.bg,"#fff",{marginTop:10,display:"inline-flex",alignItems:"center",gap:6})}}>{step.label}</button>}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* CLARIFY MODAL */}
      {clarifyItem&&(
        <div className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div className="modal-box" style={{background:"var(--surface)",color:"var(--ink)",borderRadius:12,padding:28,width:480,maxWidth:"95vw",boxShadow:"0 8px 40px rgba(0,0,0,0.32)",maxHeight:"90vh",overflowY:"auto"}}>
            <h3 style={{margin:"0 0 14px",fontSize:18,display:"flex",alignItems:"center",gap:8,color:"var(--ink)"}}>
              <Icons.inbox size={18} color={IC.inbox.bg}/>
              Clarify Item
            </h3>
            <textarea value={clarify.text} rows={1}
              ref={el=>{if(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}}}
              onChange={e=>{setClarify(c=>({...c,text:e.target.value}));e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";}}
              style={{...fieldStyle,fontFamily:"system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif",fontSize:14,padding:"10px 12px",marginBottom:16,resize:"none",overflow:"hidden",lineHeight:1.4,boxSizing:"border-box"}}/>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:13,fontFamily:"sans-serif",color:"#3a4460",marginBottom:8,fontWeight:"bold"}}>Is it actionable?</div>
              <div style={{display:"flex",gap:10}}>
                {["Yes","No"].map(v=>(
                  <button key={v} onClick={()=>setClarify(c=>({...c,actionable:v==="Yes"}))}
                    style={{flex:1,padding:"9px",border:"2px solid "+(clarify.actionable===(v==="Yes")?"#1e2430":"#cdd0d6"),borderRadius:7,background:clarify.actionable===(v==="Yes")?"#1e2430":"#f0f1f3",color:clarify.actionable===(v==="Yes")?"#ffffff":"#1e2430",cursor:"pointer",fontSize:14,fontFamily:"sans-serif"}}>{v}</button>
                ))}
              </div>
            </div>
            {clarify.actionable===false&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:13,fontFamily:"sans-serif",color:"#3a4460",marginBottom:8,fontWeight:"bold"}}>Send to:</div>
                <div style={{display:"flex",gap:8}}>
                  {["reference","someday","trash"].map(s=>{
                    const BtnIcon=sectionIcons[s];
                    const pal=IC[s]||{bg:"#8a7a65",light:"#f0ebe0",text:"#2c2416"};
                    const sel=clarify.naSection===s;
                    return(
                      <button key={s} onClick={()=>setClarify(c=>({...c,naSection:s}))}
                        style={{flex:1,padding:"10px 8px",border:sel?`2px solid ${pal.bg}`:`1px dashed ${pal.bg}66`,borderRadius:8,background:sel?pal.bg:pal.light+"80",color:sel?"#fff":pal.text,cursor:"pointer",fontSize:13,fontFamily:"sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontWeight:sel?"bold":"normal",boxShadow:sel?`0 3px 10px ${pal.bg}66`:"none",transition:"all 0.15s"}}>
                        {BtnIcon&&<BtnIcon size={14} color={sel?"#fff":pal.bg}/>}
                        {s==="reference"?"Reference":s==="someday"?"Someday":"Trash"}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
            {clarify.actionable===true&&(
              <React.Fragment>
                <div style={{marginBottom:14}}>
                  <label style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",fontSize:14,background:IC.twomin.light,border:`1px solid ${IC.twomin.bg}`,borderRadius:7,padding:"10px 14px"}}>
                    <input type="checkbox" checked={clarify.twoMin} onChange={e=>setClarify(c=>({...c,twoMin:e.target.checked}))} style={{width:16,height:16,accentColor:IC.twomin.bg}}/>
                    <Icons.twomin size={14} color={IC.twomin.bg}/>
                    <span style={{color:IC.twomin.text,fontWeight:"bold"}}>Takes less than 2 minutes</span>
                  </label>
                </div>
                {!clarify.twoMin&&(
                  <div style={{marginBottom:14}}>
                    <div style={{fontSize:13,fontFamily:"sans-serif",color:"#3a4460",marginBottom:8,fontWeight:"bold"}}>Send to:</div>
                    <div style={{display:"flex",gap:10}}>
                      {["defer","delegate"].map(s=>{
                        const BtnIcon=sectionIcons[s];
                        const pal=IC[s]||{bg:"#6b7280",light:"#f0f1f3",text:"#1e2430"};
                        const sel=clarify.destination===s;
                        return(
                          <button key={s} onClick={()=>setClarify(c=>({...c,destination:s}))}
                            style={{flex:1,padding:"12px",border:sel?`2px solid ${pal.bg}`:`1px dashed ${pal.bg}66`,borderRadius:8,background:sel?pal.bg:pal.light+"80",color:sel?"#fff":pal.text,cursor:"pointer",fontSize:14,fontFamily:"sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontWeight:sel?"bold":"normal",boxShadow:sel?`0 3px 12px ${pal.bg}66`:"none",transition:"all 0.15s"}}>
                            {BtnIcon&&<BtnIcon size={16} color={sel?"#fff":pal.bg}/>}
                            {s==="defer"?"Defer":"Delegate"}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:12,marginBottom:12}}>
                  <div style={{flex:1}}>
                    <label style={labelStyle}>Context</label>
                    <select value={clarify.context} onChange={e=>setClarify(c=>({...c,context:e.target.value}))} style={fieldStyle}>
                      {CONTEXTS.map(ctx=><option key={ctx}>{ctx}</option>)}
                    </select>
                  </div>
                  <div style={{flex:1}}>
                    <label style={labelStyle}>Project (optional)</label>
                    <select value={clarify.project||""} onChange={e=>setClarify(c=>({...c,project:e.target.value}))} style={fieldStyle}>
                      <option value="">— None —</option>
                      {data.projects.map(p=><option key={p.id} value={p.name}>{p.name}</option>)}
                    </select>
                  </div>
                </div>
                <div style={{display:"flex",gap:12,marginBottom:16}}>
                  <div style={{flex:1}}>
                    <label style={labelStyle}>Due date (optional)</label>
                    <input type="date" value={clarify.due} onChange={e=>setClarify(c=>({...c,due:e.target.value}))} style={fieldStyle}/>
                  </div>
                  <div style={{flex:1}}>
                    <label style={labelStyle}>Time (optional)</label>
                    <TimePicker value={clarify.time||""} onChange={t=>setClarify(c=>({...c,time:t}))}/>
                  </div>
                </div>
              </React.Fragment>
            )}
            <div style={{display:"flex",gap:10}}>
              <button className="btn-3d" onClick={()=>setClarifyItem(null)} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"12px 16px"})}>Cancel</button>
              <button className="btn-3d" onClick={applyClarify} style={{...mkBtn("var(--primary-bg)","var(--primary-ink)",{padding:"12px 16px"}),flex:2}}>Confirm</button>
            </div>
          </div>
        </div>
      )}

      {/* EDIT MODAL */}
      {editItem&&(
        <div className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div className="modal-box" style={{background:"var(--surface)",color:"var(--ink)",borderRadius:12,padding:28,width:480,maxWidth:"95vw",boxShadow:"0 8px 40px rgba(0,0,0,0.32)",maxHeight:"90vh",overflowY:"auto"}}>
            <h3 style={{margin:"0 0 16px",fontSize:18,color:"var(--ink)"}}>Edit Item</h3>
            <EditFields form={editForm} setForm={setEditForm} showSection={editItem.section!=="inbox"} projects={data.projects} showChecklist={false}/>
            {["twomin","defer","delegate"].includes(editForm.section)&&(
              <div style={{marginBottom:14}}>
                <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontFamily:"sans-serif",color:"#3a4460"}}>
                  <input type="checkbox" checked={editForm.done} onChange={e=>setEditForm(f=>({...f,done:e.target.checked}))} style={{width:15,height:15,accentColor:"#1e2430"}}/>
                  Mark as done
                </label>
              </div>
            )}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button className="btn-3d" onClick={()=>setEditItem(null)} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"12px 16px"})}>Cancel</button>
              <button className="btn-3d" onClick={applyEdit} style={{...mkBtn("var(--primary-bg)","var(--primary-ink)",{padding:"12px 16px"}),flex:2}}>Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* CAPTURE TO SECTION MODAL */}
      {captureModal&&(
        <div className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div className="modal-box" style={{background:"var(--surface)",color:"var(--ink)",borderRadius:12,padding:28,width:480,maxWidth:"95vw",boxShadow:"0 8px 40px rgba(0,0,0,0.32)",maxHeight:"90vh",overflowY:"auto"}}>
            <h3 style={{margin:"0 0 16px",fontSize:18,display:"flex",alignItems:"center",gap:8,color:"var(--ink)"}}>
              {sectionIcons[captureModal]&&React.createElement(sectionIcons[captureModal],{size:18,color:navIconColor[captureModal]||"#4a7fa5"})}
              Capture to {sectionLabels[captureModal]}
            </h3>
            <EditFields form={captureForm} setForm={setCaptureForm} showSection={true} projects={data.projects} showChecklist={true}/>
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button className="btn-3d" onClick={()=>setCaptureModal(null)} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"12px 16px"})}>Cancel</button>
              <button className="btn-3d" onClick={applyCapture} style={{...mkBtn("var(--primary-bg)","var(--primary-ink)",{padding:"12px 16px"}),flex:2}}>Capture</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD TASK MODAL */}
      {addTaskModal&&(
        <div className="modal-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100}}>
          <div className="modal-box" style={{background:"var(--surface)",color:"var(--ink)",borderRadius:12,padding:28,width:480,maxWidth:"95vw",boxShadow:"0 8px 40px rgba(0,0,0,0.32)",maxHeight:"90vh",overflowY:"auto"}}>
            <h3 style={{margin:"0 0 16px",fontSize:18,display:"flex",alignItems:"center",gap:8,color:"var(--ink)"}}>
              <Icons.projects size={18} color={IC.projects.bg}/>
              Add Task to Project
            </h3>
            <EditFields form={taskForm} setForm={setTaskForm} showSection={true} projects={data.projects} showChecklist={false}/>
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button className="btn-3d" onClick={()=>setAddTaskModal(null)} style={mkBtn("var(--surface-3)","var(--ink)",{padding:"12px 16px"})}>Cancel</button>
              <button className="btn-3d" onClick={applyAddTask} style={{...mkBtn("var(--primary-bg)","var(--primary-ink)",{padding:"12px 16px"}),flex:2}}>Add Task</button>
            </div>
          </div>
        </div>
      )}

      {toast&&<div style={{position:"fixed",bottom:28,left:"50%",transform:"translateX(-50%)",background:"#1e2430",color:"#ffffff",padding:"12px 24px",borderRadius:30,fontSize:14,fontFamily:"sans-serif",boxShadow:"0 4px 20px rgba(0,0,0,0.25)",zIndex:200}}>{toast}</div>}
    </div>
  );
}
